<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAMBOKA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
}

header{
    background:#ff7900;
    color:white;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:94%;
    max-width:500px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

h2{
    margin-bottom:20px;
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#ff7900;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.retour{
    background:#555;
}

.message{
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    text-align:center;
    display:none;
}

.success{
    display:block;
    background:#d9f7df;
    color:#08752c;
}

.error{
    display:block;
    background:#ffdcdc;
    color:#a00000;
}

#adminPanel{
    display:none;
}

.stat{
    background:#f5f5f5;
    padding:20px;
    margin-top:12px;
    border-radius:10px;
    text-align:center;
}

.stat b{
    font-size:30px;
    color:#ff7900;
}
</style>
</head>

<body>

<header>
🚕 YAMBOKA
</header>

<div class="container">

<!-- ACCUEIL -->

<div id="accueil" class="card">

<h2>Bienvenue sur YAMBOKA</h2>

<button onclick="ouvrirAdmin()">
🔐 ESPACE ADMINISTRATEUR
</button>

</div>


<!-- CONNEXION ADMIN -->

<div id="loginAdmin" class="card" style="display:none;">

<button
class="retour"
onclick="retourAccueil()"
>
⬅️ RETOUR
</button>

<h2>👑 Administrateur</h2>

<label for="emailAdmin">
Adresse e-mail
</label>

<input
id="emailAdmin"
type="email"
placeholder="Entrez votre e-mail"
autocomplete="email"
>

<label for="passwordAdmin">
Mot de passe
</label>

<input
id="passwordAdmin"
type="password"
placeholder="Entrez votre mot de passe"
autocomplete="current-password"
>

<button onclick="connexionAdmin()">
🔐 SE CONNECTER
</button>

<div id="message" class="message"></div>

</div>


<!-- ESPACE ADMIN -->

<div id="adminPanel" class="card">

<h2>👑 Administration YAMBOKA</h2>

<p id="adminEmailAffiche"
style="text-align:center;margin-bottom:15px;">
</p>

<div class="stat">
Courses
<br>
<b id="totalCourses">0</b>
</div>

<div class="stat">
Courses en attente
<br>
<b id="coursesAttente">0</b>
</div>

<div class="stat">
Courses terminées
<br>
<b id="coursesTerminees">0</b>
</div>

<button
onclick="deconnexion()"
style="background:#d60000;"
>
🚪 SE DÉCONNECTER
</button>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey:
    "AIzaSyAkT203kmo4NorAa0mRJY-M2u4c8v8nZ1I",

    authDomain:
    "yamboka-77173.firebaseapp.com",

    projectId:
    "yamboka-77173",

    storageBucket:
    "yamboka-77173.firebasestorage.app",

    messagingSenderId:
    "1090966765176",

    appId:
    "1:1090966765176:web:8d0aa5734f7652410cb78d",

    measurementId:
    "G-TM41TSMKCZ"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.database();


/* =========================
   OUVRIR ADMIN
========================= */

function ouvrirAdmin(){

    document
    .getElementById("accueil")
    .style.display = "none";

    document
    .getElementById("loginAdmin")
    .style.display = "block";

}


/* =========================
   RETOUR
========================= */

function retourAccueil(){

    document
    .getElementById("loginAdmin")
    .style.display = "none";

    document
    .getElementById("accueil")
    .style.display = "block";

}


/* =========================
   CONNEXION
========================= */

function connexionAdmin(){

    const email =
    document
    .getElementById("emailAdmin")
    .value
    .trim();

    const password =
    document
    .getElementById("passwordAdmin")
    .value;

    const message =
    document.getElementById("message");


    if(email === ""){

        message.className =
        "message error";

        message.innerHTML =
        "❌ Entrez votre adresse e-mail.";

        return;
    }


    if(password === ""){

        message.className =
        "message error";

        message.innerHTML =
        "❌ Entrez votre mot de passe.";

        return;
    }


    message.className =
    "message success";

    message.innerHTML =
    "⏳ Connexion en cours...";


    auth.signInWithEmailAndPassword(
        email,
        password
    )

    .then(function(result){

        message.className =
        "message success";

        message.innerHTML =
        "✅ Connexion réussie !";


        setTimeout(function(){

            afficherAdmin(result.user);

        },700);

    })

    .catch(function(error){

        console.log(error);

        message.className =
        "message error";

        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message.innerHTML =
            "❌ E-mail ou mot de passe incorrect.";

        }
        else{

            message.innerHTML =
            "❌ " + error.message;

        }

    });

}


/* =========================
   ADMIN
========================= */

function afficherAdmin(user){

    document
    .getElementById("loginAdmin")
    .style.display = "none";

    document
    .getElementById("accueil")
    .style.display = "none";

    document
    .getElementById("adminPanel")
    .style.display = "block";


    document
    .getElementById("adminEmailAffiche")
    .innerHTML =
    "🟢 Connecté avec : <b>" +
    user.email +
    "</b>";


    chargerCourses();

}


/* =========================
   COURSES
========================= */

function chargerCourses(){

    db.ref("courses")
    .on("value", function(snapshot){

        let total = 0;

        let attente = 0;

        let terminees = 0;


        snapshot.forEach(function(child){

            total++;

            const course =
            child.val();


            if(
                course.statut ===
                "en_attente"
            ){

                attente++;

            }


            if(
                course.statut ===
                "terminee"
            ){

                terminees++;

            }

        });


        document
        .getElementById("totalCourses")
        .innerText = total;


        document
        .getElementById("coursesAttente")
        .innerText = attente;


        document
        .getElementById("coursesTerminees")
        .innerText = terminees;

    });

}


/* =========================
   DECONNEXION
========================= */

function deconnexion(){

    auth.signOut()

    .then(function(){

        document
        .getElementById("adminPanel")
        .style.display = "none";

        document
        .getElementById("accueil")
        .style.display = "block";

        document
        .getElementById("emailAdmin")
        .value = "";

        document
        .getElementById("passwordAdmin")
        .value = "";

    });

}


/* =========================
   VERIFICATION SESSION
========================= */

auth.onAuthStateChanged(function(user){

    if(user){

        afficherAdmin(user);

    }

});

</script>

</body>
</html>
