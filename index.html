<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>YAMBOKA</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

header{
background:#ff7900;
color:white;
text-align:center;
padding:20px;
}

header h1{
margin:0;
font-size:32px;
}

header p{
margin:5px 0 0;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-top:15px;
box-shadow:0 3px 10px rgba(0,0,0,.12);
}

h2{
margin-top:0;
}

label{
font-weight:bold;
display:block;
margin-top:12px;
}

input,select{
width:100%;
padding:13px;
margin-top:6px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:9px;
margin-top:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#ff7900;
color:white;
}

button:hover{
opacity:.9;
}

.btn-secondary{
background:#333;
}

.btn-green{
background:#16a34a;
}

.btn-red{
background:#dc2626;
}

.hidden{
display:none;
}

.course{
border:1px solid #ddd;
border-radius:10px;
padding:15px;
margin-top:12px;
background:#fafafa;
}

.success{
background:#dcfce7;
border:1px solid #22c55e;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.info{
background:#e0f2fe;
border:1px solid #0284c7;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.warning{
background:#fef3c7;
border:1px solid #f59e0b;
padding:15px;
border-radius:10px;
margin-top:15px;
}

#map{
height:400px;
width:100%;
margin-top:15px;
border-radius:12px;
}

.status{
font-weight:bold;
padding:10px;
border-radius:8px;
background:#eee;
margin-top:10px;
}

</style>

</head>

<body>

<header>

<h1>YAMBOKA</h1>

<p>Votre transport, simplement.</p>

</header>


<div class="container">


<!-- ACCUEIL -->

<div id="accueil" class="card">

<h2>Bienvenue sur YAMBOKA</h2>

<button onclick="afficherClient()">
🧑 CLIENT
</button>

<button onclick="afficherChauffeur()">
🚗 CHAUFFEUR
</button>

</div>


<!-- CLIENT -->

<div id="espaceClient" class="card hidden">

<button
class="btn-secondary"
onclick="retourAccueil()">

⬅️ RETOUR

</button>

<h2>🧑 Espace client</h2>


<label>Nom du client</label>

<input
id="nomClient"
type="text"
placeholder="Votre nom"
/>


<label>Téléphone</label>

<input
id="telephoneClient"
type="tel"
placeholder="Votre téléphone"
/>


<label>Lieu de départ</label>

<input
id="depart"
type="text"
placeholder="Ex: Gombe"
/>


<label>Destination</label>

<input
id="destination"
type="text"
placeholder="Ex: Limete"
/>


<label>Type de véhicule</label>

<select id="vehicule">

<option value="Moto">
🏍️ Moto
</option>

<option value="Voiture">
🚗 Voiture
</option>

</select>


<label>Prix proposé (FC)</label>

<input
id="prix"
type="number"
placeholder="Ex: 5000"
/>


<button
onclick="obtenirPositionClient()">

📍 UTILISER MA POSITION

</button>


<div id="positionClientStatus"
class="status">

Position du client : non définie

</div>


<button
onclick="demanderCourse()">

🚕 DEMANDER UNE COURSE

</button>


<div id="resultatClient"></div>


<div id="map"></div>

</div>



<!-- CHAUFFEUR -->

<div id="espaceChauffeur" class="card hidden">

<button
class="btn-secondary"
onclick="retourAccueil()">

⬅️ RETOUR

</button>

<h2>🚗 Espace chauffeur</h2>


<label>Nom du chauffeur</label>

<input
id="nomChauffeur"
type="text"
placeholder="Votre nom"
/>


<label>Téléphone du chauffeur</label>

<input
id="telephoneChauffeur"
type="tel"
placeholder="Votre téléphone"
/>


<div
id="chauffeurStatus"
class="status">

🔴 Chauffeur hors ligne

</div>


<button
class="btn-green"
onclick="demarrerPositionChauffeur()">

🟢 PARTAGER MA POSITION

</button>


<button
class="btn-red"
onclick="arreterPositionChauffeur()">

🔴 ARRÊTER MA POSITION

</button>


<button
onclick="afficherCourses()">

📋 VOIR LES COURSES

</button>


<div id="courses"></div>


<div id="courseActive"></div>


<div id="mapChauffeur"></div>

</div>


</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<!-- LEAFLET -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>


/* =========================
   FIREBASE
========================= */


const firebaseConfig = {

apiKey:
"AIzaSyAkT203kmo4NorAa0mRJY-M2u4c8v8nZ1I",

authDomain:
"yamboka-77173.firebaseapp.com",

projectId:
"yamboka-77173",

storageBucket:
"yamboka-77173.firebasestorage.app",

messagingSenderId:
"1090966765176",

appId:
"1:1090966765176:web:8d0aa5734f7652410cb78d",

measurementId:
"G-TM41TSMKCZ"

};


firebase.initializeApp(firebaseConfig);

const database = firebase.database();



/* =========================
   VARIABLES
========================= */


let latitudeClient = null;

let longitudeClient = null;

let courseClientId = null;

let courseActiveId = null;

let watchChauffeur = null;

let mapClient = null;

let mapChauffeur = null;

let markerClient = null;

let markerChauffeurClient = null;

let markerClientChauffeur = null;



/* =========================
   AFFICHAGE
========================= */


function afficherClient(){

document.getElementById("accueil")
.classList.add("hidden");

document.getElementById("espaceChauffeur")
.classList.add("hidden");

document.getElementById("espaceClient")
.classList.remove("hidden");

initialiserCarteClient();

}



function afficherChauffeur(){

document.getElementById("accueil")
.classList.add("hidden");

document.getElementById("espaceClient")
.classList.add("hidden");

document.getElementById("espaceChauffeur")
.classList.remove("hidden");

initialiserCarteChauffeur();

}



function retourAccueil(){

document.getElementById("espaceClient")
.classList.add("hidden");

document.getElementById("espaceChauffeur")
.classList.add("hidden");

document.getElementById("accueil")
.classList.remove("hidden");

}



/* =========================
   CARTE CLIENT
========================= */


function initialiserCarteClient(){

if(mapClient){

setTimeout(function(){

mapClient.invalidateSize();

},200);

return;

}


mapClient = L.map("map")
.setView(
[-4.325,15.322],
13
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(mapClient);

}



/* =========================
   CARTE CHAUFFEUR
========================= */


function initialiserCarteChauffeur(){

if(mapChauffeur){

setTimeout(function(){

mapChauffeur.invalidateSize();

},200);

return;

}


mapChauffeur = L.map("mapChauffeur")
.setView(
[-4.325,15.322],
13
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(mapChauffeur);

}



/* =========================
   GPS CLIENT
========================= */


function obtenirPositionClient(){

if(!navigator.geolocation){

alert("La géolocalisation n'est pas disponible.");

return;

}


navigator.geolocation.getCurrentPosition(

function(position){

latitudeClient =
position.coords.latitude;

longitudeClient =
position.coords.longitude;


document.getElementById(
"positionClientStatus"
).innerHTML =
"🟢 Position du client enregistrée";


if(!mapClient){

initialiserCarteClient();

}


if(markerClient){

mapClient.removeLayer(markerClient);

}


markerClient = L.marker(
[
latitudeClient,
longitudeClient
]
).addTo(mapClient);


markerClient.bindPopup(
"📍 Votre position"
).openPopup();


mapClient.setView(
[
latitudeClient,
longitudeClient
],
16
);

},

function(error){

alert(
"Impossible d'obtenir votre position GPS."
);

},

{
enableHighAccuracy:true,
timeout:10000,
maximumAge:0
}

);

}



/* =========================
   DEMANDER COURSE
========================= */


function demanderCourse(){

const nom =
document.getElementById("nomClient").value.trim();

const telephone =
document.getElementById("telephoneClient").value.trim();

const depart =
document.getElementById("depart").value.trim();

const destination =
document.getElementById("destination").value.trim();

const vehicule =
document.getElementById("vehicule").value;

const prix =
document.getElementById("prix").value;


if(!nom ||
!telephone ||
!depart ||
!destination ||
!prix){

alert(
"Veuillez remplir toutes les informations."
);

return;

}


if(latitudeClient === null ||
longitudeClient === null){

alert(
"Veuillez d'abord utiliser votre position GPS."
);

return;

}


const course = {

nomClient:nom,

telephoneClient:telephone,

depart:depart,

destination:destination,

vehicule:vehicule,

prix:Number(prix),

latitudeClient:latitudeClient,

longitudeClient:longitudeClient,

statut:"en_attente",

nomChauffeur:"",

telephoneChauffeur:"",

latitudeChauffeur:null,

longitudeChauffeur:null,

date:new Date().toISOString()

};


const nouvelleCourse =
database.ref("courses").push();


nouvelleCourse
.set(course)
.then(function(){

courseClientId =
nouvelleCourse.key;


document.getElementById(
"resultatClient"
).innerHTML = `

<div class="success">

🟢 COURSE ENVOYÉE !

<br><br>

🚕 Recherche d'un chauffeur...

</div>

`;


surveillerCourse(courseClientId);

})

.catch(function(error){

alert(
"Erreur : " + error.message
);

});

}



/* =========================
   SURVEILLER COURSE
========================= */


function surveillerCourse(id){

database
.ref("courses/" + id)
.on("value",function(snapshot){

const course =
snapshot.val();


if(!course){

return;

}


if(course.statut === "acceptee"){

afficherChauffeurAuClient(course);

surveillerPositionChauffeur(id);

}

});

}



/* =========================
   CHAUFFEUR ACCEPTE
========================= */


function accepterCourse(id){

const nom =
document.getElementById(
"nomChauffeur"
).value.trim();


const telephone =
document.getElementById(
"telephoneChauffeur"
).value.trim();


if(!nom || !telephone){

alert(
"Veuillez entrer votre nom et votre téléphone."
);

return;

}


database
.ref("courses/" + id)
.update({

statut:"acceptee",

nomChauffeur:nom,

telephoneChauffeur:telephone,

latitudeChauffeur:null,

longitudeChauffeur:null

})
.then(function(){

courseActiveId = id;


document.getElementById(
"courseActive"
).innerHTML = `

<div class="success">

🟢 COURSE ACCEPTÉE !

<br><br>

👤 Client connecté.

<br><br>

📍 Vous pouvez maintenant partager votre position.

<button
class="btn-green"
onclick="demarrerPositionChauffeur()">

📍 PARTAGER MA POSITION

</button>

</div>

`;


afficherCourses();

})

.catch(function(error){

alert(
"Erreur : " + error.message
);

});

}



/* =========================
   AFFICHER COURSES
========================= */


function afficherCourses(){

database
.ref("courses")
.once("value")
.then(function(snapshot){

const courses =
snapshot.val();


const zone =
document.getElementById("courses");


zone.innerHTML =
"<h3>🚕 Courses disponibles</h3>";


if(!courses){

zone.innerHTML +=
"<p>Aucune course disponible.</p>";

return;

}


let trouve = false;


Object.keys(courses)
.forEach(function(id){

const course =
courses[id];


if(course.statut !== "en_attente"){

return;

}


trouve = true;


const div =
document.createElement("div");


div.className =
"course";


div.innerHTML = `

<strong>🧑 Client :</strong>
${course.nomClient}

<br><br>

<strong>📞 Téléphone :</strong>
${course.telephoneClient}

<br><br>

<strong>📍 Départ :</strong>
${course.depart}

<br><br>

<strong>🏁 Destination :</strong>
${course.destination}

<br><br>

<strong>🚗 Véhicule :</strong>
${course.vehicule}

<br><br>

<strong>💰 Prix :</strong>
${course.prix.toLocaleString()}
 FC

<br><br>

<button
onclick="voirPositionClient(
${course.latitudeClient},
${course.longitudeClient}
)">

🗺️ VOIR POSITION DU CLIENT

</button>

<button
class="btn-green"
onclick="accepterCourse('${id}')">

🟢 ACCEPTER LA COURSE

</button>

`;


zone.appendChild(div);

});


if(!trouve){

zone.innerHTML +=
"<p>Aucune course en attente.</p>";

}

});

}



/* =========================
   VOIR POSITION CLIENT
========================= */


function voirPositionClient(
latitude,
longitude
){

const url =
"https://www.google.com/maps?q=" +
latitude +
"," +
longitude;


window.open(
url,
"_blank"
);

}



/* =========================
   GPS CHAUFFEUR
========================= */


function demarrerPositionChauffeur(){

if(!courseActiveId){

alert(
"Vous devez d'abord accepter une course."
);

return;

}


if(!navigator.geolocation){

alert(
"La géolocalisation n'est pas disponible."
);

return;

}


if(watchChauffeur !== null){

alert(
"Votre position est déjà partagée."
);

return;

}


document.getElementById(
"chauffeurStatus"
).innerHTML =
"🟢 Chauffeur EN LIGNE — GPS actif";


watchChauffeur =
navigator.geolocation.watchPosition(

function(position){

const latitude =
position.coords.latitude;

const longitude =
position.coords.longitude;


database
.ref(
"courses/" +
courseActiveId
)
.update({

latitudeChauffeur:latitude,

longitudeChauffeur:longitude,

chauffeurEnLigne:true,

dernierePosition:
new Date().toISOString()

});


afficherPositionChauffeurSurCarte(
latitude,
longitude
);

},

function(error){

alert(
"Impossible d'obtenir la position du chauffeur."
);

},

{

enableHighAccuracy:true,

timeout:10000,

maximumAge:3000

}

);

}



/* =========================
   ARRÊTER GPS CHAUFFEUR
========================= */


function arreterPositionChauffeur(){

if(watchChauffeur !== null){

navigator.geolocation.clearWatch(
watchChauffeur
);

watchChauffeur = null;

}


if(courseActiveId){

database
.ref(
"courses/" +
courseActiveId
)
.update({

chauffeurEnLigne:false

});

}


document.getElementById(
"chauffeurStatus"
).innerHTML =
"🔴 Chauffeur hors ligne";

}



/* =========================
   POSITION CHAUFFEUR
   SUR CARTE CHAUFFEUR
========================= */


function afficherPositionChauffeurSurCarte(
latitude,
longitude
){

if(!mapChauffeur){

initialiserCarteChauffeur();

}


if(markerClientChauffeur){

markerClientChauffeur.setLatLng(
[
latitude,
longitude
]
);

}else{

markerClientChauffeur =
L.marker(
[
latitude,
longitude
]
).addTo(mapChauffeur);

markerClientChauffeur
.bindPopup(
"🚗 Ma position"
);

}


mapChauffeur.setView(
[
latitude,
longitude
],
16
);

}



/* =========================
   CLIENT :
   SUIVRE CHAUFFEUR
========================= */


function surveillerPositionChauffeur(
courseId
){

database
.ref(
"courses/" +
courseId
)
.on("value",function(snapshot){

const course =
snapshot.val();


if(!course){

return;

}


if(
course.latitudeChauffeur !== null &&
course.longitudeChauffeur !== null
){

afficherPositionChauffeurClient(

course.latitudeChauffeur,

course.longitudeChauffeur,

course.chauffeurEnLigne

);

}

});

}



/* =========================
   CLIENT :
   AFFICHER CHAUFFEUR
========================= */


function afficherChauffeurAuClient(
course
){

document.getElementById(
"resultatClient"
).innerHTML = `

<div class="success">

🟢 COURSE ACCEPTÉE !

<br><br>

👤 <strong>Chauffeur :</strong>

${course.nomChauffeur || "Non disponible"}

<br><br>

📞 <strong>Téléphone :</strong>

${course.telephoneChauffeur || "Non disponible"}

<br><br>

🚗 Votre chauffeur est en route.

<br><br>

<div id="positionChauffeurInfo">

📍 Recherche de la position du chauffeur...

</div>

</div>

`;

}



/* =========================
   CLIENT :
   MARQUEUR CHAUFFEUR
========================= */


function afficherPositionChauffeurClient(
latitude,
longitude,
enLigne
){

if(!mapClient){

initialiserCarteClient();

}


if(markerChauffeurClient){

markerChauffeurClient.setLatLng(
[
latitude,
longitude
]
);

}else{

markerChauffeurClient =
L.marker(
[
latitude,
longitude
]
).addTo(mapClient);

markerChauffeurClient
.bindPopup(
"🚗 Chauffeur"
);

}


markerChauffeurClient
.bindTooltip(
"🚗 Chauffeur"
);


mapClient.setView(
[
latitude,
longitude
],
15
);


const info =
document.getElementById(
"positionChauffeurInfo"
);


if(info){

if(enLigne === false){

info.innerHTML =
"🔴 Chauffeur hors ligne";

}else{

info.innerHTML =
"🟢 <strong>Chauffeur en ligne</strong><br>📍 Position mise à jour en temps réel.";

}

}

}



/* =========================
   AUTO : CHAUFFEUR
========================= */


document.addEventListener(
"DOMContentLoaded",
function(){

});

</script>

</body>

</html>
