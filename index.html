<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>YAMBOKA</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
    min-height:100vh;
}

header{
    background:#ff7900;
    color:white;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.container{
    width:94%;
    max-width:500px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-bottom:20px;
}

h2{
    text-align:center;
    margin-bottom:20px;
}

h3{
    margin-bottom:12px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#ff7900;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    opacity:.8;
}

.retour{
    background:#555;
}

.logout{
    background:#d60000;
}

.message{
    margin-top:15px;
    padding:13px;
    border-radius:8px;
    text-align:center;
    display:none;
    line-height:1.5;
}

.success{
    display:block;
    background:#d9f7df;
    color:#08752c;
}

.error{
    display:block;
    background:#ffdcdc;
    color:#a00000;
}

.info{
    display:block;
    background:#fff3cd;
    color:#856404;
}

#loginAdmin{
    display:none;
}

#adminPanel{
    display:none;
}

.test{
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
    line-height:1.7;
    word-break:break-word;
}

.status{
    font-weight:bold;
    font-size:18px;
}

</style></head><body><header>
🚕 YAMBOKA
</header><div class="container"><!-- =========================
     ACCUEIL
========================= --><div id="accueil" class="card"><h2>
Bienvenue sur YAMBOKA
</h2><button onclick="ouvrirAdmin()">🔐 ESPACE ADMINISTRATEUR

</button></div><!-- =========================
     CONNEXION ADMIN
========================= --><div id="loginAdmin" class="card"><button
class="retour"
onclick="retourAccueil()">

⬅️ RETOUR

</button><h2>
👑 Administrateur
</h2><label for="emailAdmin">Adresse e-mail

</label><input
id="emailAdmin"
type="email"
placeholder="Entrez votre e-mail"
autocomplete="email"

«»

<label for="passwordAdmin">Mot de passe

</label><input
id="passwordAdmin"
type="password"
placeholder="Entrez votre mot de passe"
autocomplete="current-password"

«»

<button onclick="connexionAdmin()">🔐 SE CONNECTER

</button><div
id="message"
class="message">
</div></div><!-- =========================
     ADMIN
========================= --><div id="adminPanel" class="card"><h2>👑 Administration YAMBOKA

</h2><p
id="adminEmailAffiche"
style="text-align:center;margin-bottom:15px;">
</p><div class="test"><div class="status">🟢 Firebase Authentication connecté

</div><p>Ton compte administrateur est connecté.

</p></div><div class="test"><b>
Test Firebase :
</b><br><span id="firebaseStatus">Vérification...

</span></div><button
class="logout"
onclick="deconnexion()">

🚪 SE DÉCONNECTER

</button></div><!-- =========================
     TEST AUTOMATIQUE
========================= --><div
id="testFirebase"
class="card"><h3>🔎 Test automatique Firebase

</h3><div
id="testMessage"
class="message info"
style="display:block;">⏳ Vérification de Firebase...

</div></div></div><!-- =========================
     FIREBASE
========================= --><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
</script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js">
</script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js">
</script><script>

/* ==================================================
   CONFIGURATION FIREBASE WEB
================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyAkT203kmo4NorAa0mRJY-M2u4c8v8nZ1I",

    authDomain:
    "yamboka-77173.firebaseapp.com",

    databaseURL:
    "https://yamboka-77173-default-rtdb.firebaseio.com",

    projectId:
    "yamboka-77173",

    storageBucket:
    "yamboka-77173.firebasestorage.app",

    messagingSenderId:
    "1090966765176",

    appId:
    "1:1090966765176:web:8d0aa5734f7652410cb78d",

    measurementId:
    "G-TM41TSMKCZ"

};


/* ==================================================
   INITIALISATION
================================================== */

let firebaseOK = false;

let auth = null;

let db = null;


try{

    firebase.initializeApp(firebaseConfig);

    auth = firebase.auth();

    db = firebase.database();

    firebaseOK = true;

    afficherTest(
        "success",
        "✅ Firebase est correctement initialisé.<br>" +
        "La configuration Web est chargée."
    );

}
catch(error){

    console.error(error);

    firebaseOK = false;

    afficherTest(
        "error",
        "❌ Erreur Firebase.<br><br>" +
        error.message
    );

}


/* ==================================================
   TEST AUTOMATIQUE AUTH
================================================== */

if(firebaseOK){

    auth.onAuthStateChanged(function(user){

        if(user){

            console.log(
                "Utilisateur connecté :",
                user.email
            );

            afficherTest(
                "success",
                "✅ Firebase Authentication fonctionne.<br>" +
                "Utilisateur connecté : " +
                user.email
            );

            afficherAdmin(user);

        }
        else{

            console.log(
                "Aucun utilisateur connecté."
            );

            document
            .getElementById("firebaseStatus")
            .innerHTML =
            "🟢 Firebase fonctionne. Aucun administrateur connecté.";

        }

    });

}


/* ==================================================
   AFFICHER TEST
================================================== */

function afficherTest(type,message){

    const element =
    document.getElementById("testMessage");

    if(!element){

        return;

    }

    element.className =
    "message " + type;

    element.style.display =
    "block";

    element.innerHTML =
    message;

}


/* ==================================================
   OUVRIR ADMIN
================================================== */

function ouvrirAdmin(){

    document
    .getElementById("accueil")
    .style.display =
    "none";

    document
    .getElementById("testFirebase")
    .style.display =
    "none";

    document
    .getElementById("loginAdmin")
    .style.display =
    "block";

}


/* ==================================================
   RETOUR
================================================== */

function retourAccueil(){

    document
    .getElementById("loginAdmin")
    .style.display =
    "none";

    document
    .getElementById("testFirebase")
    .style.display =
    "block";

    document
    .getElementById("accueil")
    .style.display =
    "block";

}


/* ==================================================
   CONNEXION ADMIN
================================================== */

function connexionAdmin(){

    const email =
    document
    .getElementById("emailAdmin")
    .value
    .trim();


    const password =
    document
    .getElementById("passwordAdmin")
    .value;


    const message =
    document
    .getElementById("message");


    if(!firebaseOK){

        message.className =
        "message error";

        message.innerHTML =
        "❌ Firebase n'est pas correctement initialisé.";

        return;

    }


    if(email === ""){

        message.className =
        "message error";

        message.innerHTML =
        "❌ Entrez votre adresse e-mail.";

        return;

    }


    if(password === ""){

        message.className =
        "message error";

        message.innerHTML =
        "❌ Entrez votre mot de passe.";

        return;

    }


    message.className =
    "message info";

    message.innerHTML =
    "⏳ Connexion à Firebase...";


    auth.signInWithEmailAndPassword(
        email,
        password
    )

    .then(function(result){

        console.log(
            "Connexion réussie :",
            result.user.email
        );


        message.className =
        "message success";

        message.innerHTML =
        "✅ Connexion réussie !";


        setTimeout(function(){

            afficherAdmin(
                result.user
            );

        },500);

    })

    .catch(function(error){

        console.error(
            "Erreur Firebase :",
            error
        );


        message.className =
        "message error";


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            message.innerHTML =
            "❌ E-mail ou mot de passe incorrect.";

        }

        else if(
            error.code ===
            "auth/invalid-api-key"
        ){

            message.innerHTML =
            "❌ CLÉ API FIREBASE INVALIDE.<br><br>" +
            "Code : auth/invalid-api-key";

        }

        else if(
            error.code ===
            "auth/api-key-not-valid"
        ){

            message.innerHTML =
            "❌ CLÉ API FIREBASE NON VALIDE.<br><br>" +
            "Code : auth/api-key-not-valid";

        }

        else if(
            error.code ===
            "auth/network-request-failed"
        ){

            message.innerHTML =
            "❌ Problème de connexion Internet.";

        }

        else{

            message.innerHTML =
            "❌ Erreur Firebase :<br>" +
            error.message;

        }

    });

}


/* ==================================================
   AFFICHER ADMIN
================================================== */

function afficherAdmin(user){

    document
    .getElementById("accueil")
    .style.display =
    "none";


    document
    .getElementById("loginAdmin")
    .style.display =
    "none";


    document
    .getElementById("testFirebase")
    .style.display =
    "none";


    document
    .getElementById("adminPanel")
    .style.display =
    "block";


    document
    .getElementById("adminEmailAffiche")
    .innerHTML =
    "🟢 Connecté avec : <b>" +
    user.email +
    "</b>";


    document
    .getElementById("firebaseStatus")
    .innerHTML =
    "✅ Authentification Firebase active.";

}


/* ==================================================
   DECONNEXION
================================================== */

function deconnexion(){

    if(!auth){

        return;

    }


    auth.signOut()

    .then(function(){

        document
        .getElementById("adminPanel")
        .style.display =
        "none";


        document
        .getElementById("testFirebase")
        .style.display =
        "block";


        document
        .getElementById("accueil")
        .style.display =
        "block";


        document
        .getElementById("emailAdmin")
        .value =
        "";


        document
        .getElementById("passwordAdmin")
        .value =
        "";


        document
        .getElementById("message")
        .innerHTML =
        "";


        document
        .getElementById("message")
        .className =
        "message";

    })

    .catch(function(error){

        console.error(error);

    });

}

</script></body></html>
