<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAMBOKA</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f4f4;
color:#222;
}

header{
background:#ff7900;
color:white;
text-align:center;
padding:20px;
}

header h1{
margin:0;
font-size:32px;
}

header p{
margin:5px 0 0;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-top:15px;
box-shadow:0 3px 10px rgba(0,0,0,.12);
}

.hidden{
display:none;
}

h2{
margin-top:0;
}

label{
display:block;
font-weight:bold;
margin-top:12px;
}

input,select{
width:100%;
padding:13px;
margin-top:6px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:12px;
border:0;
border-radius:9px;
background:#ff7900;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:active{
transform:scale(.98);
}

.secondary{
background:#333;
}

.green{
background:#16a34a;
}

.red{
background:#dc2626;
}

.course{
background:#fafafa;
border:1px solid #ddd;
padding:15px;
border-radius:10px;
margin-top:12px;
}

.success{
background:#dcfce7;
border:1px solid #22c55e;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.info{
background:#e0f2fe;
border:1px solid #0284c7;
padding:15px;
border-radius:10px;
margin-top:15px;
}

.status{
background:#eee;
padding:10px;
border-radius:8px;
margin-top:10px;
font-weight:bold;
}

#mapClient,
#mapChauffeur{
width:100%;
height:400px;
margin-top:15px;
border-radius:12px;
overflow:hidden;
}

</style>
</head>

<body>

<header>
<h1>YAMBOKA</h1>
<p>Votre transport, simplement.</p>
</header>

<div class="container">

<!-- ACCUEIL -->
<div id="accueil" class="card">

<h2>Bienvenue sur YAMBOKA</h2>

<button onclick="ouvrirClient()">
🧑 CLIENT
</button>

<button onclick="ouvrirChauffeur()">
🚗 CHAUFFEUR
</button>

</div>


<!-- CLIENT -->
<div id="client" class="card hidden">

<button class="secondary" onclick="retourAccueil()">
⬅️ RETOUR
</button>

<h2>🧑 Espace client</h2>

<label>Nom du client</label>

<input
id="nomClient"
type="text"
placeholder="Votre nom"
>

<label>Téléphone</label>

<input
id="telephoneClient"
type="tel"
placeholder="Votre téléphone"
>

<label>Lieu de départ</label>

<input
id="depart"
type="text"
placeholder="Ex: Gombe"
>

<label>Destination</label>

<input
id="destination"
type="text"
placeholder="Ex: Limete"
>

<label>Type de véhicule</label>

<select id="vehicule">
<option value="Moto">🏍️ Moto</option>
<option value="Voiture">🚗 Voiture</option>
</select>

<label>Prix proposé (FC)</label>

<input
id="prix"
type="number"
placeholder="Ex: 5000"
>

<button onclick="obtenirPositionClient()">
📍 UTILISER MA POSITION
</button>

<div id="statutGPSClient" class="status">
🔴 Position non définie
</div>

<button onclick="demanderCourse()">
🚕 DEMANDER UNE COURSE
</button>

<div id="resultatClient"></div>

<div id="mapClient"></div>

</div>


<!-- CHAUFFEUR -->
<div id="chauffeur" class="card hidden">

<button class="secondary" onclick="retourAccueil()">
⬅️ RETOUR
</button>

<h2>🚗 Espace chauffeur</h2>

<label>Nom du chauffeur</label>

<input
id="nomChauffeur"
type="text"
placeholder="Votre nom"
>

<label>Téléphone du chauffeur</label>

<input
id="telephoneChauffeur"
type="tel"
placeholder="Votre téléphone"
>

<div id="statutChauffeur" class="status">
🔴 Chauffeur hors ligne
</div>

<button onclick="afficherCourses()">
📋 VOIR LES COURSES
</button>

<div id="listeCourses"></div>

<div id="courseActive"></div>

<button
class="green"
onclick="demarrerGPSChauffeur()">

📍 PARTAGER MA POSITION

</button>

<button
class="red"
onclick="arreterGPSChauffeur()">

🔴 ARRÊTER MA POSITION

</button>

<div id="mapChauffeur"></div>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- LEAFLET -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* ============================
   FIREBASE
============================ */

const firebaseConfig = {

apiKey:
"AIzaSyAkT203kmo4NorAa0mRJY-M2u4c8v8nZ1I",

authDomain:
"yamboka-77173.firebaseapp.com",

projectId:
"yamboka-77173",

storageBucket:
"yamboka-77173.firebasestorage.app",

messagingSenderId:
"1090966765176",

appId:
"1:1090966765176:web:8d0aa5734f7652410cb78d",

measurementId:
"G-TM41TSMKCZ"

};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();


/* ============================
   VARIABLES
============================ */

let latitudeClient = null;
let longitudeClient = null;

let courseClientId = null;
let courseActiveId = null;

let watchGPSChauffeur = null;

let mapClient = null;
let mapChauffeur = null;

let markerClient = null;
let markerChauffeur = null;


/* ============================
   ACCUEIL
============================ */

function ouvrirClient(){

document.getElementById("accueil")
.classList.add("hidden");

document.getElementById("chauffeur")
.classList.add("hidden");

document.getElementById("client")
.classList.remove("hidden");

initialiserMapClient();

}


function ouvrirChauffeur(){

document.getElementById("accueil")
.classList.add("hidden");

document.getElementById("client")
.classList.add("hidden");

document.getElementById("chauffeur")
.classList.remove("hidden");

initialiserMapChauffeur();

}


function retourAccueil(){

document.getElementById("client")
.classList.add("hidden");

document.getElementById("chauffeur")
.classList.add("hidden");

document.getElementById("accueil")
.classList.remove("hidden");

}


/* ============================
   MAP CLIENT
============================ */

function initialiserMapClient(){

if(mapClient){

setTimeout(()=>{
mapClient.invalidateSize();
},300);

return;
}

mapClient = L.map("mapClient")
.setView([-4.325,15.322],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(mapClient);

}


/* ============================
   MAP CHAUFFEUR
============================ */

function initialiserMapChauffeur(){

if(mapChauffeur){

setTimeout(()=>{
mapChauffeur.invalidateSize();
},300);

return;
}

mapChauffeur = L.map("mapChauffeur")
.setView([-4.325,15.322],13);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(mapChauffeur);

}


/* ============================
   GPS CLIENT
============================ */

function obtenirPositionClient(){

if(!navigator.geolocation){

alert("Votre téléphone ne supporte pas la géolocalisation.");

return;
}

navigator.geolocation.getCurrentPosition(

function(position){

latitudeClient =
position.coords.latitude;

longitudeClient =
position.coords.longitude;

document.getElementById(
"statutGPSClient"
).innerHTML =
"🟢 Position GPS enregistrée";


initialiserMapClient();

if(markerClient){

markerClient.setLatLng([
latitudeClient,
longitudeClient
]);

}else{

markerClient =
L.marker([
latitudeClient,
longitudeClient
])
.addTo(mapClient);

markerClient
.bindPopup("📍 Votre position")
.openPopup();

}

mapClient.setView([
latitudeClient,
longitudeClient
],16);

},

function(error){

alert(
"Impossible d'obtenir votre position GPS. Autorisez la localisation."
);

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

}


/* ============================
   DEMANDER COURSE
============================ */

function demanderCourse(){

const nom =
document.getElementById("nomClient")
.value.trim();

const telephone =
document.getElementById("telephoneClient")
.value.trim();

const depart =
document.getElementById("depart")
.value.trim();

const destination =
document.getElementById("destination")
.value.trim();

const vehicule =
document.getElementById("vehicule")
.value;

const prix =
document.getElementById("prix")
.value;


if(
!nom ||
!telephone ||
!depart ||
!destination ||
!prix
){

alert("Veuillez remplir toutes les informations.");

return;

}


if(
latitudeClient === null ||
longitudeClient === null
){

alert(
"Veuillez d'abord utiliser votre position GPS."
);

return;

}


const course = {

nomClient:nom,

telephoneClient:telephone,

depart:depart,

destination:destination,

vehicule:vehicule,

prix:Number(prix),

latitudeClient:latitudeClient,

longitudeClient:longitudeClient,

statut:"en_attente",

nomChauffeur:"",

telephoneChauffeur:"",

latitudeChauffeur:null,

longitudeChauffeur:null,

chauffeurEnLigne:false,

date:new Date().toISOString()

};


const reference =
database.ref("courses").push();


reference
.set(course)
.then(function(){

courseClientId =
reference.key;

document.getElementById(
"resultatClient"
).innerHTML = `

<div class="info">

🔎 <strong>Recherche d'un chauffeur...</strong>

<br><br>

Votre demande a été envoyée.

</div>

`;

surveillerCourse(courseClientId);

})
.catch(function(error){

alert(
"Erreur Firebase : " +
error.message
);

});

}


/* ============================
   SURVEILLER COURSE
============================ */

function surveillerCourse(id){

database
.ref("courses/" + id)
.on("value",function(snapshot){

const course =
snapshot.val();

if(!course){

return;

}


if(course.statut === "acceptee"){

afficherChauffeurClient(course);

surveillerPositionChauffeur(id);

}

});

}


/* ============================
   AFFICHER CHAUFFEUR CLIENT
============================ */

function afficherChauffeurClient(course){

document.getElementById(
"resultatClient"
).innerHTML = `

<div class="success">

🟢 <strong>COURSE ACCEPTÉE !</strong>

<br><br>

👤 Chauffeur :
<strong>
${course.nomChauffeur || "Non disponible"}
</strong>

<br><br>

📞 Téléphone :
<strong>
${course.telephoneChauffeur || "Non disponible"}
</strong>

<br><br>

🚗 Votre chauffeur est en route.

<br><br>

<div id="positionChauffeurInfo">

📍 En attente de la position du chauffeur...

</div>

</div>

`;

}


/* ============================
   AFFICHER LES COURSES
============================ */

function afficherCourses(){

const zone =
document.getElementById("listeCourses");

zone.innerHTML =

"<div class='info'>⏳ Chargement des courses...</div>";


database
.ref("courses")
.once("value")
.then(function(snapshot){

const data =
snapshot.val();

zone.innerHTML = "<h3>🚕 Courses disponibles</h3>";


if(!data){

zone.innerHTML +=
"<div class='info'>Aucune course disponible.</div>";

return;

}


let nombre = 0;


Object.keys(data).forEach(function(id){

const course =
data[id];


if(course.statut !== "en_attente"){

return;

}


nombre++;


const div =
document.createElement("div");

div.className =
"course";


div.innerHTML = `

<strong>🧑 Client :</strong>
${course.nomClient}

<br><br>

<strong>📞 Téléphone :</strong>
${course.telephoneClient}

<br><br>

<strong>📍 Départ :</strong>
${course.depart}

<br><br>

<strong>🏁 Destination :</strong>
${course.destination}

<br><br>

<strong>🚗 Véhicule :</strong>
${course.vehicule}

<br><br>

<strong>💰 Prix :</strong>
${Number(course.prix).toLocaleString()} FC

<br><br>

<button
onclick="voirPositionClient(
${course.latitudeClient},
${course.longitudeClient}
)">

🗺️ VOIR POSITION DU CLIENT

</button>

<button
class="green"
onclick="accepterCourse('${id}')">

🟢 ACCEPTER LA COURSE

</button>

`;


zone.appendChild(div);

});


if(nombre === 0){

zone.innerHTML +=

"<div class='info'>Aucune course en attente.</div>";

}

})
.catch(function(error){

zone.innerHTML =

"<div class='info'>" +
"❌ Erreur : " +
error.message +
"</div>";

});

}


/* ============================
   ACCEPTER COURSE
============================ */

function accepterCourse(id){

const nom =
document.getElementById(
"nomChauffeur"
).value.trim();

const telephone =
document.getElementById(
"telephoneChauffeur"
).value.trim();


if(!nom || !telephone){

alert(
"Entrez d'abord votre nom et votre téléphone."
);

return;

}


database
.ref("courses/" + id)
.update({

statut:"acceptee",

nomChauffeur:nom,

telephoneChauffeur:telephone,

chauffeurEnLigne:false

})
.then(function(){

courseActiveId = id;


document.getElementById(
"courseActive"
).innerHTML = `

<div class="success">

🟢 <strong>COURSE ACCEPTÉE !</strong>

<br><br>

🧑 Client connecté.

<br><br>

📍 Cliquez sur :

<br>

<strong>
PARTAGER MA POSITION
</strong>

pour envoyer votre position au client.

</div>

`;


afficherCourses();

})
.catch(function(error){

alert(
"Erreur : " +
error.message
);

});

}


/* ============================
   POSITION CLIENT
============================ */

function voirPositionClient(
latitude,
longitude
){

const url =
"https://www.google.com/maps?q=" +
latitude +
"," +
longitude;

window.open(
url,
"_blank"
);

}


/* ============================
   GPS CHAUFFEUR
============================ */

function demarrerGPSChauffeur(){

if(!courseActiveId){

alert(
"Vous devez d'abord accepter une course."
);

return;

}


if(watchGPSChauffeur !== null){

alert(
"Le GPS est déjà actif."
);

return;

}


if(!navigator.geolocation){

alert(
"La géolocalisation n'est pas disponible."
);

return;

}


document.getElementById(
"statutChauffeur"
).innerHTML =
"🟢 Chauffeur EN LIGNE — GPS actif";


watchGPSChauffeur =
navigator.geolocation.watchPosition(

function(position){

const latitude =
position.coords.latitude;

const longitude =
position.coords.longitude;


database
.ref(
"courses/" +
courseActiveId
)
.update({

latitudeChauffeur:
latitude,

longitudeChauffeur:
longitude,

chauffeurEnLigne:true,

dernierePosition:
new Date().toISOString()

});


afficherPositionChauffeur(
latitude,
longitude
);

},

function(error){

alert(
"Erreur GPS : autorisez la localisation."
);

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:3000
}

);

}


/* ============================
   ARRÊTER GPS
============================ */

function arreterGPSChauffeur(){

if(watchGPSChauffeur !== null){

navigator.geolocation.clearWatch(
watchGPSChauffeur
);

watchGPSChauffeur = null;

}


if(courseActiveId){

database
.ref("courses/" + courseActiveId)
.update({

chauffeurEnLigne:false

});

}


document.getElementById(
"statutChauffeur"
).innerHTML =
"🔴 Chauffeur hors ligne";

}


/* ============================
   GPS CHAUFFEUR SUR SA CARTE
============================ */

function afficherPositionChauffeur(
latitude,
longitude
){

initialiserMapChauffeur();


if(markerChauffeur){

markerChauffeur.setLatLng([
latitude,
longitude
]);

}else{

markerChauffeur =
L.marker([
latitude,
longitude
])
.addTo(mapChauffeur);

markerChauffeur
.bindPopup("🚗 Votre position");

}

mapChauffeur.setView([
latitude,
longitude
],16);

}


/* ============================
   CLIENT SUIVRE CHAUFFEUR
============================ */

function surveillerPositionChauffeur(
id
){

database
.ref("courses/" + id)
.on("value",function(snapshot){

const course =
snapshot.val();

if(!course){

return;

}


if(
course.latitudeChauffeur !== null &&
course.longitudeChauffeur !== null
){

afficherPositionChauffeurClient(

course.latitudeChauffeur,

course.longitudeChauffeur,

course.chauffeurEnLigne

);

}

});

}


/* ============================
   MARQUEUR CHAUFFEUR CLIENT
============================ */

function afficherPositionChauffeurClient(
latitude,
longitude,
enLigne
){

initialiserMapClient();


if(markerChauffeur){

markerChauffeur.setLatLng([
latitude,
longitude
]);

}else{

markerChauffeur =
L.marker([
latitude,
longitude
])
.addTo(mapClient);

markerChauffeur
.bindPopup("🚗 Chauffeur")
.openPopup();

}


const info =
document.getElementById(
"positionChauffeurInfo"
);


if(info){

if(enLigne === false){

info.innerHTML =
"🔴 Chauffeur hors ligne";

}else{

info.innerHTML =
"🟢 <strong>Chauffeur en ligne</strong><br>" +
"📍 Position mise à jour en temps réel.";

}

}

}

</script>

</body>
</html>
