<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAMBOKA</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f4f4f4;
  color:#111;
}

header{
  background:#111;
  color:#FFD400;
  padding:18px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  margin-bottom:15px;
  border-radius:10px;
  border:2px solid #111;
}

h2{
  margin-top:0;
  color:#111;
}

label{
  display:block;
  margin-top:12px;
  font-weight:bold;
}

input,
select{
  width:100%;
  padding:13px;
  margin-top:5px;
  border:2px solid #111;
  border-radius:7px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:none;
  border-radius:7px;
  background:#FFD400;
  color:#111;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#e6bd00;
}

.black{
  background:#111;
  color:#FFD400;
}

.black:hover{
  background:#222;
}

.hidden{
  display:none;
}

#mapClient,
#mapChauffeur{
  width:100%;
  height:350px;
  margin-top:15px;
  border:2px solid #111;
  border-radius:8px;
}

.result{
  background:#111;
  color:#FFD400;
  padding:15px;
  margin-top:15px;
  border-radius:8px;
  font-weight:bold;
}

.course{
  border:2px solid #111;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  background:#fff;
}

.small{
  font-size:14px;
  color:#555;
}

.status{
  padding:12px;
  background:#FFD400;
  border:2px solid #111;
  border-radius:8px;
  margin-top:12px;
  font-weight:bold;
}

#message{
  margin-top:10px;
  padding:10px;
  border-radius:7px;
  display:none;
  background:#FFD400;
  border:2px solid #111;
}
</style>
</head>

<body>

<header>
  YAMBOKA
</header>

<div class="container">

  <!-- ACCUEIL -->
  <div id="accueil" class="card">
    <h2>Bienvenue sur YAMBOKA</h2>

    <button onclick="ouvrirClient()">
      🚕 CLIENT
    </button>

    <button class="black" onclick="ouvrirChauffeur()">
      CHAUFFEUR
    </button>
  </div>


  <!-- CLIENT -->
  <div id="client" class="hidden">

    <div class="card">

      <h2>Demander une course</h2>

      <label>Nom</label>
      <input id="nomClient" type="text" placeholder="Votre nom">

      <label>Téléphone</label>
      <input id="telephoneClient" type="tel" placeholder="Votre numéro">

      <label>Départ</label>
      <input id="depart" type="text" placeholder="Votre position">

      <button onclick="obtenirPositionClient()">
        📍 Utiliser ma position
      </button>

      <label>Destination</label>
      <input
        id="destination"
        type="text"
        placeholder="Ex: Gombe, Kinshasa"
      >

      <button onclick="chercherDestination()">
        🔎 Rechercher destination
      </button>

      <label>Véhicule</label>

      <select id="vehicule">
        <option value="moto">Moto</option>
        <option value="voiture">Voiture</option>
      </select>

      <button onclick="calculerCourse()">
        Calculer le prix
      </button>

      <div id="resultatClient" class="result hidden"></div>

      <button onclick="demanderCourse()">
        🚕 DEMANDER LA COURSE
      </button>

      <button class="black" onclick="retourAccueil()">
        Retour
      </button>

    </div>

    <div id="mapClient"></div>

    <div id="statutClient" class="status hidden"></div>

    <button
      id="boutonGoogleClient"
      class="hidden"
      onclick="ouvrirGoogleMaps()"
    >
      🗺️ Ouvrir Google Maps
    </button>

  </div>


  <!-- CHAUFFEUR -->
  <div id="chauffeur" class="hidden">

    <div class="card">

      <h2>Espace chauffeur</h2>

      <label>Nom</label>
      <input id="nomChauffeur" type="text" placeholder="Nom du chauffeur">

      <label>Téléphone</label>
      <input id="telephoneChauffeur" type="tel" placeholder="Téléphone">

      <button onclick="activerChauffeur()">
        🟢 Je suis disponible
      </button>

      <button class="black" onclick="desactiverChauffeur()">
        🔴 Je ne suis plus disponible
      </button>

      <div id="statutChauffeur" class="status">
        Chauffeur hors ligne
      </div>

      <button class="black" onclick="retourAccueil()">
        Retour
      </button>

    </div>

    <div class="card">

      <h2>Courses disponibles</h2>

      <div id="courses">
        Aucune course pour le moment.
      </div>

    </div>

    <div id="mapChauffeur"></div>

    <div id="courseActive" class="card hidden">

      <h2>Course active</h2>

      <div id="detailsCourseActive"></div>

      <button onclick="allerChezClient()">
        🗺️ Aller chez le client
      </button>

      <button onclick="changerStatutCourse('en_route')">
        🚕 En route
      </button>

      <button onclick="changerStatutCourse('client_recupere')">
        👤 Client récupéré
      </button>

      <button onclick="changerStatutCourse('terminee')">
        ✅ Course terminée
      </button>

    </div>

  </div>

  <div id="message"></div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyAkT203kmo4NorAa0mRJY-M2u4c8v8nZ1I",
  authDomain: "yamboka-77173.firebaseapp.com",
  projectId: "yamboka-77173",
  storageBucket: "yamboka-77173.firebasestorage.app",
  messagingSenderId: "1090966765176",
  appId: "1:1090966765176:web:8d0aa5734f7652410cb78d",
  measurementId: "G-TM41TSMKCZ"
};

let database = null;

try{
  if(typeof firebase === "undefined"){
    throw new Error("Firebase non chargé");
  }

  firebase.initializeApp(firebaseConfig);
  database = firebase.database();

}catch(error){

  console.error(error);

}


/* =========================
   VARIABLES
========================= */

let positionClient = null;
let destinationPosition = null;

let positionChauffeur = null;

let mapClient = null;
let mapChauffeur = null;

let markerClient = null;
let markerDestination = null;
let markerChauffeur = null;

let courseActiveId = null;

let courseCalculee = null;

let googleDestination = null;

let watchClient = null;
let watchChauffeur = null;


/* =========================
   OUTILS
========================= */

function afficherMessage(message){

  const element = document.getElementById("message");

  element.innerText = message;
  element.style.display = "block";

  setTimeout(function(){
    element.style.display = "none";
  },4000);
}


function afficherEcran(id){

  document.getElementById("accueil").classList.add("hidden");
  document.getElementById("client").classList.add("hidden");
  document.getElementById("chauffeur").classList.add("hidden");

  document.getElementById(id).classList.remove("hidden");
}


/* =========================
   NAVIGATION
========================= */

function ouvrirClient(){

  afficherEcran("client");

  setTimeout(function(){

    initialiserMapClient();

  },300);
}


function ouvrirChauffeur(){

  afficherEcran("chauffeur");

  setTimeout(function(){

    initialiserMapChauffeur();

  },300);

}


function retourAccueil(){

  afficherEcran("accueil");

}


/* =========================
   MAP CLIENT
========================= */

function initialiserMapClient(){

  if(typeof L === "undefined"){

    afficherMessage("La carte n'est pas disponible.");

    return;
  }

  if(mapClient){

    mapClient.invalidateSize();

    return;
  }

  mapClient = L.map("mapClient").setView(
    [-4.325,15.322],
    12
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(mapClient);

}


/* =========================
   POSITION CLIENT
========================= */

function obtenirPositionClient(){

  if(!navigator.geolocation){

    afficherMessage("GPS non disponible.");

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position){

      positionClient = {
        lat:position.coords.latitude,
        lng:position.coords.longitude
      };

      document.getElementById("depart").value =
        positionClient.lat.toFixed(6) +
        ", " +
        positionClient.lng.toFixed(6);

      if(mapClient){

        mapClient.setView(
          [
            positionClient.lat,
            positionClient.lng
          ],
          16
        );

        if(markerClient){

          markerClient.setLatLng([
            positionClient.lat,
            positionClient.lng
          ]);

        }else{

          markerClient = L.marker([
            positionClient.lat,
            positionClient.lng
          ])
          .addTo(mapClient)
          .bindPopup("Votre position")
          .openPopup();

        }

      }

      afficherMessage("Position trouvée.");

    },

    function(error){

      afficherMessage(
        "Impossible d'obtenir votre position GPS."
      );

      console.error(error);

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );
}


/* =========================
   DESTINATION
========================= */

async function chercherDestination(){

  const destination =
    document
    .getElementById("destination")
    .value
    .trim();

  if(!destination){

    afficherMessage("Entrez une destination.");

    return;
  }

  try{

    const url =
      "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
      encodeURIComponent(destination);

    const response = await fetch(url);

    const data = await response.json();

    if(!data.length){

      afficherMessage("Destination introuvable.");

      return;
    }

    destinationPosition = {
      lat:parseFloat(data[0].lat),
      lng:parseFloat(data[0].lon)
    };

    googleDestination =
      destinationPosition.lat +
      "," +
      destinationPosition.lng;

    if(mapClient){

      mapClient.setView(
        [
          destinationPosition.lat,
          destinationPosition.lng
        ],
        15
      );

      if(markerDestination){

        markerDestination.setLatLng([
          destinationPosition.lat,
          destinationPosition.lng
        ]);

      }else{

        markerDestination = L.marker([
          destinationPosition.lat,
          destinationPosition.lng
        ])
        .addTo(mapClient)
        .bindPopup("Destination")
        .openPopup();

      }

    }

    afficherMessage("Destination trouvée.");

  }catch(error){

    console.error(error);

    afficherMessage(
      "Erreur pendant la recherche."
    );

  }
}


/* =========================
   CALCUL COURSE
========================= */

async function calculerCourse(){

  if(!positionClient){

    afficherMessage(
      "Utilisez d'abord votre position GPS."
    );

    return;
  }

  if(!destinationPosition){

    afficherMessage(
      "Recherchez d'abord la destination."
    );

    return;
  }

  try{

    const url =
      "https://router.project-osrm.org/route/v1/driving/" +
      positionClient.lng +
      "," +
      positionClient.lat +
      ";" +
      destinationPosition.lng +
      "," +
      destinationPosition.lat +
      "?overview=false";

    const response = await fetch(url);

    const data = await response.json();

    if(!data.routes || !data.routes.length){

      afficherMessage(
        "Impossible de calculer la route."
      );

      return;
    }

    const distanceKm =
      data.routes[0].distance / 1000;

    const dureeMinutes =
      data.routes[0].duration / 60;

    const vehicule =
      document
      .getElementById("vehicule")
      .value;

    const tarif =
      vehicule === "moto"
      ? 1000
      : 1500;

    const fraisDepart = 2000;

    let prix =
      fraisDepart +
      distanceKm * tarif;

    prix =
      Math.ceil(prix / 500) * 500;

    courseCalculee = {
      distanceKm:distanceKm,
      dureeMinutes:dureeMinutes,
      prix:prix,
      vehicule:vehicule
    };

    const resultat =
      document.getElementById("resultatClient");

    resultat.innerHTML =
      "Distance : " +
      distanceKm.toFixed(1) +
      " km<br>" +

      "Durée : " +
      Math.round(dureeMinutes) +
      " min<br>" +

      "Prix : " +
      prix.toLocaleString("fr-FR") +
      " FC";

    resultat.classList.remove("hidden");

    afficherMessage("Prix calculé.");

  }catch(error){

    console.error(error);

    afficherMessage(
      "Erreur pendant le calcul."
    );

  }
}


/* =========================
   DEMANDER COURSE
========================= */

function demanderCourse(){

  if(!database){

    afficherMessage(
      "Firebase n'est pas disponible."
    );

    return;
  }

  const nom =
    document
    .getElementById("nomClient")
    .value
    .trim();

  const telephone =
    document
    .getElementById("telephoneClient")
    .value
    .trim();

  if(!nom){

    afficherMessage("Entrez votre nom.");

    return;
  }

  if(!telephone){

    afficherMessage(
      "Entrez votre numéro."
    );

    return;
  }

  if(!positionClient){

    afficherMessage(
      "Indiquez votre position."
    );

    return;
  }

  if(!destinationPosition){

    afficherMessage(
      "Indiquez votre destination."
    );

    return;
  }

  if(!courseCalculee){

    afficherMessage(
      "Calculez d'abord le prix."
    );

    return;
  }

  const course = {

    nomClient:nom,

    telephoneClient:telephone,

    depart:{
      lat:positionClient.lat,
      lng:positionClient.lng
    },

    destination:{
      lat:destinationPosition.lat,
      lng:destinationPosition.lng
    },

    vehicule:courseCalculee.vehicule,

    distanceKm:courseCalculee.distanceKm,

    dureeMinutes:courseCalculee.dureeMinutes,

    prix:courseCalculee.prix,

    statut:"en_attente",

    date:Date.now()

  };

  database
  .ref("courses")
  .push(course)

  .then(function(result){

    courseActiveId = result.key;

    document
    .getElementById("statutClient")
    .innerText =
      "Course envoyée. Recherche d'un chauffeur...";

    document
    .getElementById("statutClient")
    .classList.remove("hidden");

    document
    .getElementById("boutonGoogleClient")
    .classList.remove("hidden");

    afficherMessage(
      "Course envoyée avec succès."
    );

    surveillerCourseClient(courseActiveId);

  })

  .catch(function(error){

    console.error(error);

    afficherMessage(
      "Erreur lors de l'envoi de la course."
    );

  });

}


/* =========================
   SURVEILLER COURSE CLIENT
========================= */

function surveillerCourseClient(id){

  if(!database) return;

  database
  .ref("courses/" + id)
  .on("value",function(snapshot){

    const course = snapshot.val();

    if(!course) return;

    const statut =
      document.getElementById("statutClient");

    statut.classList.remove("hidden");

    if(course.statut === "en_attente"){

      statut.innerText =
        "🟡 Recherche d'un chauffeur...";

    }

    else if(course.statut === "acceptee"){

      statut.innerText =
        "🟢 Un chauffeur a accepté votre course.";

    }

    else if(course.statut === "en_route"){

      statut.innerText =
        "🚕 Le chauffeur est en route.";

    }

    else if(course.statut === "client_recupere"){

      statut.innerText =
        "👤 Le chauffeur vous a récupéré.";

    }

    else if(course.statut === "terminee"){

      statut.innerText =
        "✅ Course terminée.";

    }

    if(
      course.positionChauffeur &&
      mapClient
    ){

      const lat =
        course.positionChauffeur.lat;

      const lng =
        course.positionChauffeur.lng;

      if(markerChauffeur){

        markerChauffeur.setLatLng([
          lat,
          lng
        ]);

      }else{

        markerChauffeur =
          L.marker([
            lat,
            lng
          ])
          .addTo(mapClient)
          .bindPopup("Chauffeur");

      }

    }

  });

}


/* =========================
   GOOGLE MAPS
========================= */

function ouvrirGoogleMaps(){

  if(!googleDestination){

    afficherMessage(
      "Destination non disponible."
    );

    return;
  }

  const url =
    "https://www.google.com/maps/dir/?api=1&destination=" +
    encodeURIComponent(
      googleDestination
    );

  window.open(
    url,
    "_blank"
  );

}


/* =========================
   MAP CHAUFFEUR
========================= */

function initialiserMapChauffeur(){

  if(typeof L === "undefined"){

    afficherMessage(
      "La carte n'est pas disponible."
    );

    return;
  }

  if(mapChauffeur){

    mapChauffeur.invalidateSize();

    return;
  }

  mapChauffeur =
    L.map("mapChauffeur")
    .setView(
      [-4.325,15.322],
      12
    );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:"© OpenStreetMap"
    }
  ).addTo(mapChauffeur);

}


/* =========================
   CHAUFFEUR DISPONIBLE
========================= */

function activerChauffeur(){

  if(!database){

    afficherMessage(
      "Firebase n'est pas disponible."
    );

    return;
  }

  const nom =
    document
    .getElementById("nomChauffeur")
    .value
    .trim();

  const telephone =
    document
    .getElementById("telephoneChauffeur")
    .value
    .trim();

  if(!nom){

    afficherMessage(
      "Entrez votre nom."
    );

    return;
  }

  if(!telephone){

    afficherMessage(
      "Entrez votre numéro."
    );

    return;
  }

  if(!navigator.geolocation){

    afficherMessage(
      "GPS non disponible."
    );

    return;
  }

  navigator.geolocation.getCurrentPosition(

    function(position){

      positionChauffeur = {
        lat:position.coords.latitude,
        lng:position.coords.longitude
      };

      const chauffeur = {

        nom:nom,

        telephone:telephone,

        disponible:true,

        position:positionChauffeur,

        date:Date.now()

      };

      database
      .ref("chauffeurs/" + telephone)
      .set(chauffeur)

      .then(function(){

        document
        .getElementById("statutChauffeur")
        .innerText =
          "🟢 Vous êtes disponible.";

        afficherMessage(
          "Vous êtes maintenant disponible."
        );

        afficherPositionChauffeur();

        chargerCourses();

        demarrerGPSChauffeur();

      })

      .catch(function(error){

        console.error(error);

        afficherMessage(
          "Erreur Firebase."
        );

      });

    },

    function(error){

      console.error(error);

      afficherMessage(
        "Activez la localisation GPS."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

}


/* =========================
   POSITION CHAUFFEUR
========================= */

function afficherPositionChauffeur(){

  if(!mapChauffeur || !positionChauffeur)
    return;

  mapChauffeur.setView(
    [
      positionChauffeur.lat,
      positionChauffeur.lng
    ],
    16
  );

  if(markerChauffeur){

    markerChauffeur.setLatLng([
      positionChauffeur.lat,
      positionChauffeur.lng
    ]);

  }else{

    markerChauffeur =
      L.marker([
        positionChauffeur.lat,
        positionChauffeur.lng
      ])
      .addTo(mapChauffeur)
      .bindPopup("Votre position");

  }

}


/* =========================
   GPS CHAUFFEUR EN CONTINU
========================= */

function demarrerGPSChauffeur(){

  if(!navigator.geolocation)
    return;

  if(watchChauffeur)
    navigator.geolocation.clearWatch(
      watchChauffeur
    );

  watchChauffeur =
    navigator.geolocation.watchPosition(

      function(positi
