```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAMBOKA</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f4;
  color:#111;
}

header{
  background:#111;
  color:#FFD400;
  padding:20px;
  text-align:center;
  font-size:30px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:20px;
  border:2px solid #111;
  border-radius:12px;
  margin-bottom:20px;
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:8px;
  background:#FFD400;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

.black{
  background:#111;
  color:#FFD400;
}

.hidden{
  display:none !important;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:6px;
  border:2px solid #111;
  border-radius:8px;
  font-size:16px;
}

label{
  display:block;
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
YAMBOKA
</header>

<div class="container">

<!-- ACCUEIL -->

<div id="accueil" class="card">

<h2>Bienvenue sur YAMBOKA</h2>

<button id="btnClient">
🚕 CLIENT
</button>

<button id="btnChauffeur" class="black">
🚗 CHAUFFEUR
</button>

</div>


<!-- CLIENT -->

<div id="client" class="card hidden">

<h2>🚕 Espace Client</h2>

<label>Nom</label>

<input
id="nomClient"
type="text"
placeholder="Votre nom"
>

<label>Téléphone</label>

<input
id="telephoneClient"
type="tel"
placeholder="Votre numéro"
>

<label>Départ</label>

<input
id="depart"
type="text"
placeholder="Votre départ"
>

<label>Destination</label>

<input
id="destination"
type="text"
placeholder="Votre destination"
>

<select id="vehicule">

<option value="moto">
Moto
</option>

<option value="voiture">
Voiture
</option>

</select>

<button>
🚕 DEMANDER UNE COURSE
</button>

<button
id="retourClient"
class="black">

⬅️ RETOUR

</button>

</div>


<!-- CHAUFFEUR -->

<div id="chauffeur" class="card hidden">

<h2>🚗 Espace Chauffeur</h2>

<label>Nom</label>

<input
id="nomChauffeur"
type="text"
placeholder="Votre nom"
>

<label>Téléphone</label>

<input
id="telephoneChauffeur"
type="tel"
placeholder="Votre téléphone"
>

<button>
🟢 JE SUIS DISPONIBLE
</button>

<button
id="retourChauffeur"
class="black">

⬅️ RETOUR

</button>

</div>

</div>


<script>

/* BOUTON CLIENT */

document
.getElementById("btnClient")
.addEventListener("click", function(){

  document
  .getElementById("accueil")
  .classList
  .add("hidden");

  document
  .getElementById("chauffeur")
  .classList
  .add("hidden");

  document
  .getElementById("client")
  .classList
  .remove("hidden");

});


/* BOUTON CHAUFFEUR */

document
.getElementById("btnChauffeur")
.addEventListener("click", function(){

  document
  .getElementById("accueil")
  .classList
  .add("hidden");

  document
  .getElementById("client")
  .classList
  .add("hidden");

  document
  .getElementById("chauffeur")
  .classList
  .remove("hidden");

});


/* RETOUR CLIENT */

document
.getElementById("retourClient")
.addEventListener("click", function(){

  document
  .getElementById("client")
  .classList
  .add("hidden");

  document
  .getElementById("accueil")
  .classList
  .remove("hidden");

});


/* RETOUR CHAUFFEUR */

document
.getElementById("retourChauffeur")
.addEventListener("click", function(){

  document
  .getElementById("chauffeur")
  .classList
  .add("hidden");

  document
  .getElementById("accueil")
  .classList
  .remove("hidden");

});

</script>

</body>
</html>
